create:
  fields:
    title:
      required: true
      example: "Put the bins out"
      selector:
        text:
    message:
      selector:
        text:
          multiline: true
    due:
      required: true
      selector:
        datetime:
    user_id:
      selector:
        text:
    delivery_mode:
      default: default
      selector:
        select:
          options:
            - default
            - custom
    channels: &channels
      selector:
        select:
          multiple: true
          options:
            - persistent_notification
            - phone
            - voice
    notify_targets: &notify_targets
      selector:
        entity:
          multiple: true
          filter:
            domain: notify
    voice_targets: &voice_targets
      selector:
        entity:
          multiple: true
          filter:
            domain: assist_satellite

create_recurring:
  fields:
    title:
      required: true
      example: "Put the recycling out"
      selector:
        text:
    message:
      selector:
        text:
          multiline: true
    first_reminder:
      required: true
      selector:
        datetime:
    frequency:
      required: true
      selector:
        select:
          options:
            - daily
            - weekly
            - monthly
    interval:
      default: 1
      selector:
        number:
          min: 1
          max: 365
          mode: box
    weekdays:
      selector:
        select:
          multiple: true
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    day_of_month:
      selector:
        number:
          min: 1
          max: 31
          mode: box
    timezone:
      selector:
        text:
    user_id:
      selector:
        text:
    delivery_mode:
      default: default
      selector:
        select:
          options:
            - default
            - custom
    channels: *channels
    notify_targets: *notify_targets
    voice_targets: *voice_targets

get:
  fields:
    reminder_id: &reminder_id
      required: true
      selector:
        text:

list:
  fields:
    user_id:
      selector:
        text:
    pending_only:
      default: false
      selector:
        boolean:
    due_after:
      selector:
        datetime:
    due_before:
      selector:
        datetime:

update:
  fields:
    reminder_id: *reminder_id
    title:
      selector:
        text:
    message:
      selector:
        text:
          multiline: true
    due:
      selector:
        datetime:
    user_id:
      selector:
        text:
    delivery_mode:
      selector:
        select:
          options:
            - default
            - custom
    channels: *channels
    notify_targets: *notify_targets
    voice_targets: *voice_targets
    first_reminder:
      selector:
        datetime:
    frequency:
      selector:
        select:
          options:
            - daily
            - weekly
            - monthly
    interval:
      selector:
        number:
          min: 1
          max: 365
          mode: box
    weekdays:
      selector:
        select:
          multiple: true
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    day_of_month:
      selector:
        number:
          min: 1
          max: 31
          mode: box
    timezone:
      selector:
        text:

delete:
  fields:
    reminder_id: *reminder_id

snooze:
  fields:
    reminder_id: *reminder_id
    due:
      selector:
        datetime:
    duration:
      selector:
        duration:

set_user_preferences:
  fields:
    user_id:
      selector:
        text:
    channels: *channels
    notify_targets: *notify_targets
    voice_targets: *voice_targets
