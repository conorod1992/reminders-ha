create:
  name: Create a reminder
  description: Creates a one-time reminder. Delivery, completion tracking, and quiet hours use the selected user's current defaults unless overridden.
  fields:
    title: &title
      name: Title
      description: What should be remembered.
      required: true
      example: "Put the bins out"
      selector:
        text:
    message: &message
      name: Message
      description: Optional extra detail delivered with the title.
      example: "Put the recycling bin at the kerb."
      selector:
        text:
          multiline: true
    due:
      name: When
      description: Exact due date and time. A value without an offset uses Home Assistant's timezone.
      required: true
      example: "2026-08-04 20:00:00"
      selector:
        datetime:
    user_id: &user
      name: User
      description: Recipient. Leave empty to use the authenticated caller; only administrators can select another user.
      selector:
        text:
    delivery_mode: &delivery_mode
      name: Delivery
      description: Use the user's live defaults, or provide channels and targets for this reminder.
      default: default
      selector:
        select:
          options:
            - label: Use the user's defaults
              value: default
            - label: Choose channels for this reminder
              value: custom
    channels: &channels
      name: Delivery channels
      description: Logical delivery methods used when Delivery is custom.
      selector:
        select:
          multiple: true
          options:
            - label: Home Assistant notification
              value: persistent_notification
            - label: Phone notification
              value: phone
            - label: Assist satellite voice
              value: voice
    notify_targets: &notify_targets
      name: Phones
      description: Notify entities used by the phone channel.
      selector:
        entity:
          multiple: true
          filter:
            domain: notify
    mobile_app_services: &mobile_app_services
      name: Companion App services
      description: Explicit notify.mobile_app services that support actionable notifications.
      example: ["notify.mobile_app_my_phone"]
      selector:
        text:
          multiple: true
    voice_targets: &voice_targets
      name: Voice devices
      description: Assist satellites used for voice announcements.
      selector:
        entity:
          multiple: true
          filter:
            domain: assist_satellite
    acknowledgement_policy: &ack_policy
      name: Dismissal tracking
      description: Inherit the user's preference, keep reminding until dismissed, or skip dismissal tracking.
      default: default
      selector:
        select:
          options:
            - label: Use the user's default
              value: default
            - label: Keep reminding until dismissed
              value: required
            - label: Do not require dismissal
              value: not_required
    quiet_hours_policy: &quiet_policy
      name: Quiet hours
      description: Respect the user's current quiet hours or bypass them for an urgent reminder.
      default: respect
      selector:
        select:
          options:
            - label: Respect quiet hours
              value: respect
            - label: Ignore quiet hours (urgent)
              value: ignore
    deliver_when: &deliver_when
      name: Deliver when
      description: Optional bounded state, numeric_state, zone, event, or named context checked only after the due time.
      selector:
        object:
    complete_when: &complete_when
      name: Complete automatically when
      description: Optional bounded trigger that resolves the relevant occurrence without claiming a user marked it Done.
      selector:
        object:
    escalation: &escalation
      name: Escalation
      description: Optional initial_delay_minutes, repeat_minutes, and max_attempts for reminders awaiting dismissal.
      selector:
        object:
    allow_manual_completion: &allow_manual_completion
      name: Allow “Done”
      description: Lets the user explicitly report that the underlying task was completed.
      default: false
      selector:
        boolean:
    source: &source
      name: External source
      description: Optional stable integration identifier that manages this reminder.
      selector:
        text:
    source_id: &source_id
      name: External source ID
      description: Optional stable identifier of the source object.
      selector:
        text:
    source_event: &source_event
      name: External source event
      description: Optional source milestone or event type.
      selector:
        text:
    managed_externally: &managed_externally
      name: Managed externally
      description: Marks the reminder as managed by its source integration.
      default: false
      selector:
        boolean:
    external_actions: &external_actions
      name: External actions
      description: Up to five inert id/label actions reported back through reminders_lifecycle. Only valid when managed externally.
      selector:
        object:

create_recurring:
  name: Create a recurring reminder
  description: Creates an anchored recurring series. The first reminder fixes the local wall-clock phase and DST behavior.
  fields:
    title: *title
    message: *message
    first_reminder: &first_reminder
      name: First reminder
      description: First eligible local date/time and the permanent recurrence anchor.
      required: true
      example: "2026-08-03 20:00:00"
      selector:
        datetime:
    frequency: &frequency
      name: Repeat
      description: Calendar unit used by the recurrence.
      required: true
      selector:
        select:
          options:
            - label: Daily
              value: daily
            - label: Weekly
              value: weekly
            - label: Monthly
              value: monthly
            - label: Yearly
              value: yearly
    interval: &interval
      name: Every
      description: Number of days, active weeks, months, or years between occurrences.
      default: 1
      selector:
        number:
          min: 1
          max: 365
          mode: box
    weekdays: &weekdays
      name: Weekdays
      description: Days within each active week. The first reminder must be on one of them.
      selector:
        select:
          multiple: true
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    monthly_mode: &monthly_mode
      name: Monthly pattern
      description: Use a calendar day, nth weekday, last weekday, or last calendar day.
      selector:
        select:
          options:
            - label: Day of month
              value: day_of_month
            - label: Nth weekday
              value: nth_weekday
            - label: Last weekday
              value: last_weekday
            - label: Last calendar day
              value: last_day
    day_of_month: &day_of_month
      name: Day of month
      description: Calendar day for day-of-month rules. Invalid months are skipped, preserving existing behavior.
      selector:
        number:
          min: 1
          max: 31
          mode: box
    monthly_weekday: &monthly_weekday
      name: Monthly weekday
      description: Weekday for nth-weekday or last-weekday patterns.
      selector:
        select:
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    monthly_week: &monthly_week
      name: Week number
      description: 1 for first, 2 for second, through 5 for fifth. Used only by nth-weekday rules.
      selector:
        number:
          min: 1
          max: 5
          mode: box
    end_date: &end_date
      name: End date
      description: Optional final eligible local calendar date (inclusive).
      selector:
        date:
    occurrence_count: &occurrence_count
      name: Maximum occurrences
      description: Optional one-based limit counted from the original anchor, including occurrences skipped during downtime.
      selector:
        number:
          min: 1
          mode: box
    timezone: &timezone
      name: Timezone
      description: Optional IANA timezone. Defaults to Home Assistant's configured timezone.
      example: "Europe/Dublin"
      selector:
        text:
    user_id: *user
    delivery_mode: *delivery_mode
    channels: *channels
    notify_targets: *notify_targets
    mobile_app_services: *mobile_app_services
    voice_targets: *voice_targets
    acknowledgement_policy: *ack_policy
    quiet_hours_policy: *quiet_policy
    deliver_when: *deliver_when
    complete_when: *complete_when
    escalation: *escalation
    allow_manual_completion: *allow_manual_completion
    source: *source
    source_id: *source_id
    source_event: *source_event
    managed_externally: *managed_externally
    external_actions: *external_actions

get:
  name: Get a reminder
  description: Returns one reminder by its immutable ID after checking caller ownership.
  fields:
    reminder_id: &reminder_id
      name: Reminder ID
      description: Immutable ID returned by create or list.
      required: true
      selector:
        text:

list:
  name: List reminders
  description: Returns reminders visible to the caller, with optional search and due-time filters.
  fields:
    user_id: *user
    pending_only:
      name: Upcoming only
      description: Return only reminders waiting for their next delivery.
      default: false
      selector:
        boolean:
    query:
      name: Search
      description: Case-insensitive title and message search.
      selector:
        text:
    due_after:
      name: Due after
      description: Include reminders due at or after this time.
      selector:
        datetime:
    due_before:
      name: Due before
      description: Include reminders due at or before this time.
      selector:
        datetime:
    source: *source
    source_id: *source_id

update:
  name: Update a reminder
  description: Updates selected fields while preserving retained history. Recurring due times remain derived from their recurrence.
  fields:
    reminder_id: *reminder_id
    title: *title
    message: *message
    due:
      name: New due time
      description: One-time reminders only.
      selector:
        datetime:
    user_id: *user
    delivery_mode: *delivery_mode
    channels: *channels
    notify_targets: *notify_targets
    mobile_app_services: *mobile_app_services
    voice_targets: *voice_targets
    acknowledgement_policy: *ack_policy
    quiet_hours_policy: *quiet_policy
    deliver_when: *deliver_when
    complete_when: *complete_when
    escalation: *escalation
    allow_manual_completion: *allow_manual_completion
    source: *source
    source_id: *source_id
    source_event: *source_event
    managed_externally: *managed_externally
    external_actions: *external_actions
    first_reminder: *first_reminder
    frequency: *frequency
    interval: *interval
    weekdays: *weekdays
    monthly_mode: *monthly_mode
    day_of_month: *day_of_month
    monthly_weekday: *monthly_weekday
    monthly_week: *monthly_week
    end_date: *end_date
    occurrence_count: *occurrence_count
    timezone: *timezone

delete:
  name: Delete a reminder
  description: Permanently deletes a one-time reminder or an entire recurring series.
  fields:
    reminder_id: *reminder_id

snooze:
  name: Snooze a reminder
  description: Moves a one-time reminder or only the active occurrence of a recurring series.
  fields:
    reminder_id: *reminder_id
    due:
      name: New due time
      description: Exact snooze time. Do not also provide Duration.
      selector:
        datetime:
    duration:
      name: Duration
      description: Relative snooze duration. Do not also provide New due time.
      selector:
        duration:

acknowledge:
  name: Dismiss a reminder
  description: Stops reminders for one occurrence without claiming the underlying task was completed.
  fields:
    reminder_id: *reminder_id
    occurrence_id:
      name: Occurrence ID
      description: Optional for a one-time reminder or when exactly one series occurrence awaits acknowledgement; otherwise required.
      selector:
        text:

complete:
  name: Complete a reminder task
  description: Reports the underlying task completed when Allow “Done” is enabled.
  fields:
    reminder_id: *reminder_id
    occurrence_id:
      name: Occurrence ID
      selector:
        text:

external_action:
  name: Select an external reminder action
  description: Reports one configured source-defined action to the owning integration.
  fields:
    reminder_id: *reminder_id
    occurrence_id:
      name: Occurrence ID
      required: true
      selector:
        text:
    external_action_id:
      name: External action ID
      required: true
      selector:
        text:

set_user_preferences:
  name: Set reminder preferences
  description: Sets one user's live delivery, acknowledgement, history, and quiet-hours defaults.
  fields:
    user_id: *user
    channels: *channels
    notify_targets: *notify_targets
    mobile_app_services: *mobile_app_services
    voice_targets: *voice_targets
    require_acknowledgement:
      name: Keep reminding until dismissed by default
      description: Applied at each occurrence's delivery time when its policy is Use my default.
      default: false
      selector:
        boolean:
    quiet_hours_enabled:
      name: Enable quiet hours
      description: Suppresses configured channels during the local wall-clock window.
      default: false
      selector:
        boolean:
    quiet_hours_start:
      name: Quiet hours start
      description: Local wall-clock start; overnight windows are supported.
      default: "23:00:00"
      selector:
        time:
    quiet_hours_end:
      name: Quiet hours end
      description: Local wall-clock end.
      default: "07:00:00"
      selector:
        time:
    quiet_hours_channels:
      name: Suppressed channels
      description: Channels to suppress during quiet hours. Voice is the recommended default.
      default:
        - voice
      selector:
        select:
          multiple: true
          options:
            - persistent_notification
            - phone
            - voice
    quiet_hours_fallback_channels:
      name: Fallback channels
      description: Channels added when a selected channel is suppressed; persistent notification is the safe default.
      default:
        - persistent_notification
      selector:
        select:
          multiple: true
          options:
            - persistent_notification
            - phone
            - voice
    history_retention_days:
      name: History retention days
      description: Completed occurrence history older than this is removed; awaiting acknowledgement is protected.
      default: 90
      selector:
        number:
          min: 1
          max: 3650
          mode: box
    history_max_occurrences:
      name: Maximum retained occurrences
      description: Per-reminder count cap in addition to the age limit.
      default: 250
      selector:
        number:
          min: 10
          max: 5000
          mode: box

test_delivery:
  name: Test reminder delivery
  description: Sends a harmless test through real delivery providers without creating a reminder or history record.
  fields:
    user_id: *user
    channels: *channels
    notify_targets: *notify_targets
    mobile_app_services: *mobile_app_services
    voice_targets: *voice_targets

create_triggered:
  name: Create a triggered reminder
  description: Creates a reminder that is activated directly by an entity, zone, event, or named trigger without creating a Home Assistant automation.
  fields:
    title: *title
    message: *message
    trigger:
      name: Trigger
      description: Structured state, numeric_state, zone, event, or named trigger definition.
      required: true
      example:
        type: state
        entity_id: sensor.work_status
        to: Finished for today
      selector:
        object:
    user_id: *user
    repeat_policy:
      name: Repeat policy
      default: once
      selector:
        select:
          options:
            - label: Once
              value: once
            - label: Every trigger
              value: every_trigger
            - label: Rearm after acknowledgement
              value: rearm_after_acknowledgement
    fire_if_already_matching:
      name: Fire immediately if already matching
      description: Off by default. When disabled, waits for the next matching change after creation or restart.
      default: false
      selector:
        boolean:
    cooldown_seconds:
      name: Cooldown
      description: Minimum seconds between occurrence creation for this reminder.
      default: 0
      selector:
        number:
          min: 0
          max: 31536000
          mode: box
          unit_of_measurement: seconds
    available_from:
      name: Available from
      selector:
        datetime:
    expires_at:
      name: Expiry
      selector:
        datetime:
    delivery_mode: *delivery_mode
    channels: *channels
    notify_targets: *notify_targets
    mobile_app_services: *mobile_app_services
    voice_targets: *voice_targets
    acknowledgement_policy: *ack_policy
    quiet_hours_policy: *quiet_policy
    complete_when: *complete_when
    escalation: *escalation
    allow_manual_completion: *allow_manual_completion
    source: *source
    source_id: *source_id
    source_event: *source_event
    managed_externally: *managed_externally
    external_actions: *external_actions

fire_trigger:
  name: Fire a named reminder trigger
  description: Activates eligible reminders owned by the caller and armed for this named trigger.
  fields:
    trigger_id:
      name: Trigger ID
      required: true
      example: printing_started
      selector:
        text:
    user_id: *user
